# Template: the nginx image fills in the API_ORIGIN variable at container start.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same policy as csp.ts. Every location repeats the add_header because a
  # location with its own add_header drops the server-level ones. The worker
  # script gets its policy from its own response, so assets need it too.
  set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; worker-src 'self'; connect-src 'self' blob: ${API_ORIGIN}; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy $csp always;
    try_files $uri =404;
  }

  # Files with an extension are static assets: a missing one is a 404, not the app shell.
  location ~ \.[a-zA-Z0-9]+$ {
    add_header Content-Security-Policy $csp always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    try_files $uri /index.html;
  }
}
