services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5055
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - facefit-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5055:5055"
    environment:
      - PORT=5055
    networks:
      - facefit-network

networks:
  facefit-network:
    driver: bridge
